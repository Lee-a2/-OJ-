<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>新增题目 | 我的 OJ 平台</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/oj.css">
</head>
<body>
<header class="app-header">
    <div class="layout-container app-header__inner">
        <a class="brand" href="index.html">我的 OJ 平台</a>
        <div class="app-header__actions">
            <a class="nav-link" href="function.html">管理中心</a>
            <a class="btn btn-ghost" href="logout">注销</a>
        </div>
    </div>
</header>

<section class="page-hero page-hero--compact">
    <div class="layout-container">
        <p class="eyebrow">Admin Console</p>
        <h1>新增题目</h1>
        <p>完善题目信息、测试用例与模板代码，提交后即可在题库中发布。</p>
    </div>
</section>

<main class="page-content">
    <section class="page-section">
        <div class="layout-container">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">题目信息</h2>
                    <span class="badge">管理员专用</span>
                </div>
                <form id="addProblemForm" class="form-grid">
                    <div>
                        <label class="form-label" for="problemTitle">标题</label>
                        <input id="problemTitle" class="form-control" required placeholder="例如：两数之和">
                    </div>
                    <div>
                        <label class="form-label" for="problemLevel">难度</label>
                        <input id="problemLevel" class="form-control" required placeholder="简单 / 中等 / 困难">
                    </div>
                    <div>
                        <label class="form-label" for="problemDescription">题目描述</label>
                        <textarea id="problemDescription" class="form-control" rows="8" required placeholder="描述题目背景、输入输出格式等细节"></textarea>
                    </div>
                    <div>
                        <label class="form-label" for="problemTest">测试用例</label>
                        <textarea id="problemTest" class="form-control" rows="8" required placeholder="使用 JSON 或自定义格式描述测试用例"></textarea>
                    </div>
                    <div>
                        <label class="form-label" for="problemTemplate">模板代码</label>
                        <textarea id="problemTemplate" class="form-control" rows="10" required placeholder="提供给选手的初始代码模板"></textarea>
                    </div>
                    <div id="problemFeedback" class="form-feedback"></div>
                    <div class="card-header" style="padding:0; border:none;">
                        <button type="submit" class="btn btn-primary">提交题目</button>
                        <a href="function.html" class="btn btn-ghost">返回管理页</a>
                    </div>
                </form>
            </div>
        </div>
    </section>
</main>

<footer class="page-footer">
    <div class="layout-container">
        <p>&copy; 参考资料</p>
    </div>
</footer>

<script src="js/jquery.min.js"></script>
<script src="js/common.js"></script>
<script>
    (function () {
        const form = document.querySelector("#addProblemForm");
        const feedback = document.querySelector("#problemFeedback");
        const titleInput = document.querySelector("#problemTitle");
        const levelInput = document.querySelector("#problemLevel");
        const descInput = document.querySelector("#problemDescription");
        const testInput = document.querySelector("#problemTest");
        const templateInput = document.querySelector("#problemTemplate");

        function showFeedback(message, type) {
            feedback.textContent = message;
            feedback.className = "form-feedback form-feedback--show form-feedback--" + type;
        }

        form.addEventListener("submit", function (event) {
            event.preventDefault();
            const payload = {
                id: 0,
                title: titleInput.value.trim(),
                level: levelInput.value.trim(),
                description: descInput.value.trim(),
                testCode: testInput.value.trim(),
                templateCode: templateInput.value,
            };

            OJ.request({
                url: "addProblem",
                method: "POST",
                data: payload,
                success(data) {
                    if (data && data.correct) {
                        showFeedback("题目已提交，正在跳转…", "success");
                        setTimeout(() => window.location.assign("function.html"), 800);
                    } else {
                        showFeedback("服务器未通过题目校验，请检查内容。", "error");
                    }
                },
                error() {
                    showFeedback("提交失败，请稍后重试。", "error");
                }
            });
        });

        OJ.ensureAdmin();
    })();
</script>
</body>
</html>
